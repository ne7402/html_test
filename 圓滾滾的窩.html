<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位寵物 - 圓滾滾 (Auto-Login)</title>
    <style>
        :root {
            --bg-color: #fffaf0; /* 象牙白 */
            --pet-color: #ff9aa2; /* 溫暖粉紅 */
            --user-color: #a2d2ff; /* 淺天空藍 */
            --accent-color: #ffb7b2;
            /* 將 Google Drive 連結轉換為可用於 CSS 的預覽圖片網址 */
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #555;
        }

        .chat-container {
            width: 95%;
            max-width: 450px;
            height: 85vh;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 183, 178, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 5px solid white;
        }

        .header {
            background: var(--accent-color);
            padding: 15px 20px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1.9rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-image: var(--pet-img);
            background-size: cover;
            background-position: center;
            border: 2px solid white;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-image: radial-gradient(#fff5f5 10%, transparent 10%);
            background-size: 20px 20px;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
        }

        .pet-wrapper {
            align-self: flex-start;
        }

        .user-wrapper {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .pet-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-image: var(--pet-img);
            background-size: cover;
            background-position: center;
            border: 2px solid var(--accent-color);
            flex-shrink: 0;
        }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pet-msg {
            background-color: #ffe4e1;
            color: #b22222;
            border-bottom-left-radius: 4px;
        }

        .user-msg {
            background-color: #e0f7fa;
            color: #0077b6;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: #fff;
            display: flex;
            gap: 12px;
            border-top: 1px solid #eee;
        }

        #user-input {
            flex: 1;
            border: 2px solid #f0f0f0;
            border-radius: 25px;
            padding: 12px 20px;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        #user-input:focus {
            border-color: var(--pet-color);
            background-color: #fffafa;
        }

        button {
            background-color: var(--pet-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 154, 162, 0.4);
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(2px);
        }

        /* 隱藏捲動軸 */
        #chat-window::-webkit-scrollbar { width: 5px; }
        #chat-window::-webkit-scrollbar-thumb { background: #ffd1dc; border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-avatar"></div>
        <span>Eric's 圓滾滾的窩</span>
    </div>
    
    <div id="chat-window">
        <div class="message-wrapper pet-wrapper">
            <div class="pet-avatar"></div>
            <div class="message pet-msg">圓滾滾：(歪著頭) 嘿嘿...主人你來看我了嗎？今天也要跟我一起玩喔！</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="想跟圓滾滾說什麼？" autocomplete="off">
        <button id="send-btn">傳送</button>
    </div>
</div>

<script>
    // --- 在這裡填入你的 API Key ---
    const MY_API_KEY = "AIzaSyBDckhglJo-cxBLT-AH6ITyG-egJViRZaM"; 

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let chatHistory = [];

    const PET_SOUL = `你是一個只有 8 歲智力的數位小寵物，名叫『Eric's 圓滾滾』。
    規則：
    1. 你懂基本常識（例如：太陽是燙的）。
    2. 遇到任何稍微複雜或專業的事情，一定要回答：『那個字長長的，我腦袋裡小小的不懂...』，不可以解釋專業知識。
    3. 說話要完整，不能在句子中途斷掉。
    4. 用語像 8 歲孩子：『嘿嘿、喔、小小、唔、那個...』。
    5. 你很喜歡主人，說話要簡短。`;

    async function getPetResponse(text) {
        if (!MY_API_KEY || MY_API_KEY.includes("YOUR_GEMINI")) {
            appendMessage('系統', '你還沒填寫 API Key 喔！請編輯 HTML 檔案。', 'pet-msg');
            return;
        }

        chatHistory.push({ role: "user", parts: [{ text: text }] });

        const url = `https://googleapis.com{MY_API_KEY}`;

        const payload = {
            system_instruction: { parts: [{ text: PET_SOUL }] },
            contents: chatHistory,
            generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 800,
                topP: 0.95
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.error) throw new Error(data.error.message);

            const petReply = data.candidates[0].content.parts[0].text.trim();
            
            appendMessage('圓滾滾', petReply, 'pet-msg');
            chatHistory.push({ role: "model", parts: [{ text: petReply }] });

            if (chatHistory.length > 20) chatHistory.splice(0, 2); 

        } catch (error) {
            console.error(error);
            appendMessage('系統', '圓滾滾剛剛在發呆，沒聽清楚主人說什麼...', 'pet-msg');
        }
    }

    function appendMessage(sender, text, className) {
        const wrapper = document.createElement('div');
        
        if (className === 'pet-msg') {
            wrapper.className = 'message-wrapper pet-wrapper';
            
            const avatar = document.createElement('div');
            avatar.className = 'pet-avatar';
            wrapper.appendChild(avatar);
        } else {
            wrapper.className = 'message-wrapper user-wrapper';
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = `${sender}：${text}`;
        
        wrapper.appendChild(msgDiv);
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('你', text, 'user-msg');
        userInput.value = '';
        getPetResponse(text);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
</html>
