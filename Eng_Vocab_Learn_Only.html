<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eric's Middle High School Vocabulary Master 專業版</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #D2BEAA; 
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* 視窗化結構與間隔 */
        #app {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 95%;
            max-width: 1000px;
            align-items: center;
        }

        .window {
            background: #ffffff;
            border-radius: 40px;
            padding: 50px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            display: none; /* 預設隱藏，由 JS 控制顯示 */
        }
        .window.active { display: block; }

        /* 首頁樣式 */
        .main-title { font-size: 3.4rem; font-weight: 900; margin-bottom: 10px; color: #444; }
        .sub-title { font-size: 1.6rem; color: #777; margin-bottom: 30px; }
        
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 80%;
            max-width: 400px;
        }
        .select-group label {
            font-size: 1.1rem;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }

        .custom-select {
            font-size: 1.3rem;
            padding: 12px 20px;
            border-radius: 15px;
            border: 3px solid #ddd;
            background: #f9f9f9;
            cursor: pointer;
            width: 100%;
        }

        /* 測驗畫面樣式 */
        .progress-text { font-size: 2rem; font-weight: bold; color: #8B5E3C; margin-bottom: 15px; }
        .progress-container { background: #eee; height: 15px; border-radius: 10px; margin-bottom: 40px; overflow: hidden; }
        .progress-bar { background: #8B5E3C; height: 100%; width: 0%; transition: width 0.3s; }

        /* 單字比例 */
        .quiz-word { font-size: 3.8rem; font-weight: 900; margin: 20px 0; display: block; line-height: 1.2; word-break: break-word; }
        .audio-btn { 
            background: #f0f0f0; border: none; padding: 15px 30px; border-radius: 40px; 
            font-size: 1.2rem; cursor: pointer; margin-bottom: 30px; font-weight: bold;
        }
        .audio-btn:hover { background: #e0e0e0; }

        /* 選項按鈕：大字體且並排 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .option-btn {
            font-size: 1.8rem; font-weight: bold; padding: 25px; 
            border: 3px solid #eee; border-radius: 20px; background: #fff;
            cursor: pointer; transition: 0.2s; text-align: center; word-break: break-word;
        }
        .option-btn:hover { background: #fdf5ef; border-color: #D2BEAA; }

        /* 結果畫面樣式 */
        .final-score { font-size: 8rem; font-weight: 900; line-height: 1; margin: 20px 0; }
        .score-red { color: #d9534f; }
        .score-yellow { color: #f0ad4e; }
        .score-green { color: #5cb85c; }

        /* 表格優化 */
        .table-container { margin-top: 30px; border-radius: 20px; overflow: hidden; border: 1px solid #eee; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 1.2rem; }
        th { background: #f8f8f8; padding: 15px; color: #666; text-align: left; position: sticky; top: 0; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        .col-word { font-weight: bold; color: #5a4fcf; width: 30%; }
        .col-ans { width: 25%; }
        .col-user { width: 25%; }
        .col-res { width: 20%; text-align: center; }

        .start-btn {
            background: #333; color: #fff; padding: 18px 50px; font-size: 1.8rem; 
            font-weight: bold; border-radius: 20px; border: none; cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        .start-btn:hover { background: #555; }
        .action-btn { margin-top: 25px; background: #8B5E3C; }
        .action-btn:hover { background: #6F4A2F; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 視窗 1：首頁 -->
        <section id="start-screen" class="window active">
            <h1 class="main-title">Eric's 國中英文單字學習模式</h1>
            <p class="sub-title">請選擇學習功能模式</p>
            
            <div class="setup-container">
                <!-- 選擇單字範圍 -->
                <div class="select-group">
                    <label for="level-select">1. 單字級別</label>
                    <select id="level-select" class="custom-select" onchange="updatePartOptions()">
                        <option value="easy">Easy (國一/基礎)</option>
                        <option value="medium" selected>Medium (國二/中級)</option>
                        <option value="hard">Hard (國三/挑戰)</option>
                        <option value="basic">Basic (教育部國中1200單字)</option>
                        <option value="advanced">Advanced (國中進階800單字)</option>
                    </select>
                </div>

                <!-- 選擇分段學習 -->
                <div class="select-group">
                    <label for="part-select">2. 學習區段 (50字一組)</label>
                    <select id="part-select" class="custom-select">
                        <!-- JavaScript 動態生成 -->
                    </select>
                </div>

                <!-- 選擇翻譯方向模式 -->
                <div class="select-group">
                    <label for="mode-select">3. 學習方向</label>
                    <select id="mode-select" class="custom-select">
                        <option value="en-to-zh">英翻中 (看英文學習中文)</option>
                        <option value="zh-to-en">中翻英 (看中文學習英文)</option>
                    </select>
                </div>
            </div>
            
            <button class="start-btn" onclick="initiateQuiz()">START</button>
        </section>

        <!-- 視窗 2：測驗中 -->
        <section id="quiz-screen" class="window">
            <div class="progress-text" id="progress-text">Question 01 / 20</div>
            <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
            <div class="quiz-word" id="current-word">WORD</div>
            <button class="audio-btn" id="speak-btn" onclick="speakWord()">🔊 發音</button>
            <div id="options-grid" class="options-grid"></div>
        </section>

        <!-- 視窗 3：結果 -->
        <section id="result-screen" class="window">
            <h2 style="font-size: 3rem;">測驗完成</h2>
            <div id="final-score" class="final-score">0</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th id="th-word">單字</th>
                            <th>正確</th>
                            <th>你的回答</th>
                            <th style="text-align:center">結果</th>
                        </tr>
                    </thead>
                    <tbody id="result-table-body"></tbody>
                </table>
            </div>
            <button class="start-btn action-btn" onclick="returnToStart()">TRY AGAIN</button>
        </section>
    </div>

            {w:"vote",m:"投票/表決"}, {w:"waist",m:"腰部"}, {w:"walkman",m:"隨身聽"}, {w:"war",m:"戰爭"}, {w:"waste",m:"浪費"},

            {w:"winner",m:"贏家"}, {w:"wok",m:"炒菜鍋"}, {w:"wolf",m:"野狼"}, {w:"women's room",m:"女廁"}, {w:"wood",m:"木頭"},
            {w:"woods",m:"森林"}, {w:"worm",m:"蠕蟲"}, {w:"wound",m:"傷口/使…受傷"}, {w:"wrist",m:"手腕"}, {w:"yell",m:"喊/吼"},

        // 測驗全域變數
        let currentQuizList = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];
        let currentMode = 'en-to-zh'; // 'en-to-zh' 或 'zh-to-en'
        const TOTAL_QUESTIONS = 20;

        // 當單字切換或等級改變時，動態刷新「段落選項」
        function updatePartOptions() {
            const levelSelect = document.getElementById('level-select');
            const partSelect = document.getElementById('part-select');
            if (!levelSelect || !partSelect) return;

            const currentLevel = levelSelect.value;
            const wordList = vocabData[currentLevel] || [];
            
            partSelect.innerHTML = '';
            
            // 選項 A: 全部單字
            let allOpt = document.createElement('option');
            allOpt.value = 'all';
            allOpt.innerText = `全部單字 (共 ${wordList.length} 字)`;
            partSelect.appendChild(allOpt);
            
            // 選項 B: 50字分段
            const chunkSize = 50;
            const namePrefix = currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1);
            
            for (let i = 0; i < wordList.length; i += chunkSize) {
                let start = i + 1;
                let end = Math.min(i + chunkSize, wordList.length);
                let opt = document.createElement('option');
                opt.value = `${i}-${end}`;
                opt.innerText = `${namePrefix}: ${start}-${end}`;
                partSelect.appendChild(opt);
            }
        }

        // 初始化與重置回首頁
        function returnToStart() {
            showWindow('start-screen');
            updatePartOptions();
        }

        // 當網頁載入時啟動
        window.addEventListener('DOMContentLoaded', () => {
            updatePartOptions();
        });

        // 洗牌與開始測驗核心邏輯
        function initiateQuiz() {
            const level = document.getElementById('level-select').value;
            const partRange = document.getElementById('part-select').value;
            currentMode = document.getElementById('mode-select').value;
            
            let fullList = [...vocabData[level]];
            let questionsToTake = TOTAL_QUESTIONS; // 預設 20 題

            // 檢查是否使用 50字分段模式
            if (partRange !== 'all') {
                const [startIdx, endIdx] = partRange.split('-').map(Number);
                fullList = fullList.slice(startIdx, endIdx);
                
                // 核心功能修改：分段學習測試模式下，題數等於該分段的單字數
                questionsToTake = fullList.length;
            } else {
                // 全部單字模式：若單字不夠 20 個，則以單字總數為準
                questionsToTake = Math.min(fullList.length, TOTAL_QUESTIONS);
            }

            // Fisher-Yates Shuffle 洗牌
            for (let i = fullList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [fullList[i], fullList[j]] = [fullList[j], fullList[i]];
            }

            // 精確截取題目清單
            currentQuizList = fullList.slice(0, questionsToTake);

            if (currentQuizList.length === 0) {
                alert('該範圍內沒有可用的單字，請重新選擇！');
                return;
            }

            // 重置進度與狀態
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            // 切換測驗視窗
            showWindow('quiz-screen');
            showQuestion();
        }

        // 視窗切換
        function showWindow(id) {
            document.querySelectorAll('.window').forEach(win => win.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 發音功能 (使用瀏覽器內建語音 TTS)
        function speakWord() {
            // 隨時取得當前英文單字進行發音
            const item = currentQuizList[currentIndex];
            const msg = new SpeechSynthesisUtterance(item.w);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(msg);
        }

        // 產生干擾選項
        function getDistractors(correctAnswer, count, type) {
            // 將所有可用單字的中文或英文攤平成陣列，當作干擾來源
            const allItems = Object.values(vocabData).flat();
            const allOptions = allItems.map(item => type === 'zh' ? item.m : item.w);
            const distractors = new Set();

            while (distractors.size < count) {
                const randomOption = allOptions[Math.floor(Math.random() * allOptions.length)];
                if (randomOption !== correctAnswer) {
                    distractors.add(randomOption);
                }
            }
            return Array.from(distractors);
        }

        // 顯示題目
        function showQuestion() {
            const item = currentQuizList[currentIndex];
            const qCount = currentQuizList.length;
            
            // 更新畫面的進度條與文字
            document.getElementById('progress-text').innerText = `Question ${String(currentIndex + 1).padStart(2, '0')} / ${String(qCount).padStart(2, '0')}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / qCount) * 100}%`;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            let correctText = '';
            let options = [];

            if (currentMode === 'en-to-zh') {
                // 英翻中模式：看英文單字、選中文答案
                document.getElementById('current-word').innerText = item.w;
                document.getElementById('speak-btn').style.display = 'inline-block';
                correctText = item.m;
                
                const distractors = getDistractors(correctText, 0, 'zh');
                options = [correctText, ...distractors];
            } else {
                // 中翻英模式：看中文單字、選英文答案
                document.getElementById('current-word').innerText = item.m;
                document.getElementById('speak-btn').style.display = 'none'; // 中文畫面隱藏發音按鈕
                correctText = item.w;
                
                const distractors = getDistractors(correctText, 0, 'en');
                options = [correctText, ...distractors];
            }

            // 將選項隨機洗牌
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, correctText);
                grid.appendChild(btn);
            });

            // 如果是英翻中模式，主動唸出單字
            if (currentMode === 'en-to-zh') {
                speakWord();
            }
        }

        // 處理使用者答案與動態計分
        function handleAnswer(selectedOption, correctText) {
            const item = currentQuizList[currentIndex];
            const isCorrect = selectedOption === correctText;
            const qCount = currentQuizList.length;

            // 動態權重計分：不論題數是 50 題或 20 題，滿分皆為 100 分
            const ptsPerQuestion = 100 / qCount;
            if (isCorrect) {
                score += ptsPerQuestion;
            }

            userAnswers.push({
                word: item.w,
                meaning: item.m,
                correct: correctText,
                user: selectedOption,
                status: isCorrect
            });

            if (currentIndex < qCount - 1) {
                currentIndex++;
                showQuestion();
            } else {
                displayResults();
            }
        }

        // 顯示結果畫面
        function displayResults() {
            showWindow('result-screen');
            
            const finalScore = Math.round(score);
            const scoreEl = document.getElementById('final-score');
            scoreEl.innerText = finalScore;

            // 分數顏色判斷
            scoreEl.className = 'final-score';
            if (finalScore < 60) scoreEl.classList.add('score-red');
            else if (finalScore < 85) scoreEl.classList.add('score-yellow');
            else scoreEl.classList.add('score-green');

            // 調整結果表格標題
            document.getElementById('th-word').innerText = currentMode === 'en-to-zh' ? '單字' : '題目中文';

            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';

            userAnswers.forEach(item => {
                const tr = document.createElement('tr');
                const cambridgeUrl = "https://dictionary.cambridge.org/dictionary/english-chinese-traditional/" + encodeURIComponent(item.word.toLowerCase());
                
                // 根據模式顯示正確對照欄位
                let displaySubject = currentMode === 'en-to-zh' 
                    ? `<a href="${cambridgeUrl}" target="_blank" style="text-decoration:none; color:inherit;">${item.word}</a>`
                    : item.meaning;

                let displayCorrect = currentMode === 'en-to-zh' ? item.meaning : item.word;

                tr.innerHTML = `
                    <td class="col-word">${displaySubject}</td>
                    <td class="col-ans">${displayCorrect}</td>
                    <td class="col-user" style="color: ${item.status ? '#333' : '#d9534f'}">${item.user}</td>
                    <td class="col-res" style="color: ${item.status ? '#5cb85c' : '#d9534f'}; font-weight:bold;">${item.status ? '對' : '錯'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 補丁載入語音引擎
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
